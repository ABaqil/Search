name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    # Fresh Linux machine provided by GitHub
    runs-on: ubuntu-latest

    steps:

      # Download your code onto GitHub's machine
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Java on GitHub's machine
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Build the JAR file using Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Build Docker image tagged with your Docker Hub username
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/search:latest .

      # Login to Docker Hub using your saved secrets
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

      # Push image to Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/search:latest

      # Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: kubectl apply -f deployment.yaml