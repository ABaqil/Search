apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
      - name: search
        image: abdudevolop/search:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
spec:
  selector:
    app: search
  ports:
  - port: 8080
    targetPort: 8080
  type: NodePort